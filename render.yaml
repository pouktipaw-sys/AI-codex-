services:
  - type: web
    name: flowstate-ai
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: FLOW_ENVIRONMENT
        value: hosted
      - key: FLOW_FREE_HOSTING
        value: "true"
      - key: FLOW_STORAGE_MODE
        value: ephemeral
      - key: FLOW_PROVIDER
        value: local
      - key: FLOW_DATABASE_URL
        value: sqlite:////var/data/flowstate/flowstate.db
      - key: FLOW_API_TOKEN
        generateValue: true
      - key: FLOW_DEMO_PASSWORD
        generateValue: true
