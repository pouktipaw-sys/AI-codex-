[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "flowstate-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "mcp>=1.12,<2"]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pip-audit>=2.9"]
postgres = ["psycopg[binary]>=3.2"]
[tool.setuptools.packages.find]
where = ["backend"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
